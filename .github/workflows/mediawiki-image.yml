name: mediawiki image

# Builds the wiki image of the mediawiki add-on, runs the access-tier checks
# against it and publishes it to ghcr.io as
# <MediaWiki version>-<add-on version>, the tag docker-compose.yml pulls by
# default. A published tag is never overwritten: a change under
# mediawiki/image/ needs a new add-on version, which the check job enforces
# on pull requests.

on:
  push:
    branches: [main, 'releases/**']
    paths:
      - 'mediawiki/**'
      - '.github/workflows/mediawiki-image.yml'
  pull_request:
    paths:
      - 'mediawiki/**'
      - '.github/workflows/mediawiki-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fidonis/papaia-mediawiki

jobs:
  check:
    name: Image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Derive the tag and compare it with docker-compose.yml
        id: tag
        run: |
          set -euo pipefail
          mw="$(sed -n 's#^FROM docker.io/library/mediawiki:\([0-9.]*\)$#\1#p' mediawiki/image/Dockerfile)"
          addon="$(sed -n 's/^version: *//p' mediawiki/papaia-app.yaml)"
          tag="$mw-$addon"
          [[ -n "$mw" && -n "$addon" ]] || { echo "::error::cannot read the MediaWiki or add-on version"; exit 1; }
          grep -q "MEDIAWIKI_IMAGE:-$IMAGE:$tag}" mediawiki/docker-compose.yml \
            || { echo "::error file=mediawiki/docker-compose.yml::default image tag must be $IMAGE:$tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Require a new add-on version for image changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE:mediawiki/papaia-app.yaml" 2>/dev/null || exit 0
          git diff --quiet "$BASE" HEAD -- mediawiki/image && exit 0
          old="$(git show "$BASE:mediawiki/papaia-app.yaml" | sed -n 's/^version: *//p')"
          new="$(sed -n 's/^version: *//p' mediawiki/papaia-app.yaml)"
          if [[ "$old" == "$new" ]]; then
            echo "::error file=mediawiki/papaia-app.yaml::mediawiki/image/ changed, so the add-on version ($new) must change too -- the image tag is derived from it"
            exit 1
          fi

  test:
    name: Build and tier checks
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build
        run: docker build -t "$IMAGE:${{ needs.check.outputs.tag }}" mediawiki/image
      - name: Access-tier checks
        run: mediawiki/tests/run.sh

  publish:
    name: Publish
    needs: [check, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip a tag that is already published
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ needs.check.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${{ needs.check.outputs.tag }} is already published; leaving it unchanged"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.published == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.published == 'false'
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.published == 'false'
        with:
          context: mediawiki/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.check.outputs.tag }}
