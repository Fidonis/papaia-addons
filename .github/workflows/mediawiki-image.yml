name: mediawiki image

# Builds, scans, publishes and signs the wiki image of the mediawiki add-on,
# ghcr.io/fidonis/papaia-mediawiki:<MediaWiki version>-<add-on version>.
#
# - check: derives the tag from the Dockerfile and the manifest and holds the
#   default in docker-compose.yml to a published tag and its digest
#   (`$IMAGE:<tag>@sha256:<digest>`, the digest the registry serves). A new
#   tag cannot be pinned before it exists, so the default may name the
#   previous tag only while the new one is not published yet. On a milestone
#   the default may instead name the signed candidate of the new tag from a
#   local test registry; main and pull requests into it refuse that.
# - test (pull requests and pushes): builds linux/amd64 and linux/arm64 and
#   scans each build with Trivy; tools/scan_gate.py fails on CRITICAL or HIGH
#   findings with a fix (exceptions: security/exceptions.yaml). The
#   access-tier checks run against the amd64 build (they start the stack,
#   which under emulation would take most of the job's time). A seeded
#   critical report must fail the same gate, so a broken gate cannot pass
#   silently.
# - publish (main and releases/** only): pushes the build by digest, without
#   a tag. It scans and gates the manifest of each platform, attaches one
#   CycloneDX SBOM per platform as a signed attestation (to the platform
#   manifest and to the index), signs the index and its manifests with the
#   release key into the signature repository the core verifies against and
#   verifies all of it. Only then does the tag appear, pointing at that
#   digest. A failure in any step leaves an untagged digest and no tag, so
#   the next run builds and tries again. A published tag is never
#   overwritten; a change under mediawiki/image/ needs a new add-on version.
#   A tag that is published already is verified instead, and the job fails
#   when its signature or SBOM attestation is missing.
#
# The scan of the published, pinned image on every pull request and every
# night is the vulnerability job of ci.yml, together with the other images.

on:
  push:
    branches: [main, 'releases/**']
    paths:
      - 'mediawiki/**'
      - 'security/exceptions.yaml'
      - 'tools/scan_gate.py'
      - 'kit.lock'
      - 'tools/ci/**'
      - '.github/workflows/mediawiki-image.yml'
  pull_request:
    paths:
      - 'mediawiki/**'
      - 'security/exceptions.yaml'
      - 'tools/scan_gate.py'
      - 'kit.lock'
      - 'tools/ci/**'
      - '.github/workflows/mediawiki-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fidonis/papaia-mediawiki
  # The core verifies add-on signatures in this repository (cosign's
  # COSIGN_REPOSITORY); the image repositories hold no signatures.
  SIGNATURES: ghcr.io/fidonis/papaia-signatures
  # ghcr.io/sigstore/cosign/cosign:v2.4.1, the version the core's verifier is tested against.
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31
  TRIVY_VERSION: v0.76.2
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.12"
  UV_PROJECT: tools/ci

jobs:
  check:
    name: Image tag and pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kit: ${{ steps.tag.outputs.kit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the tag
        id: tag
        run: |
          set -euo pipefail
          mw="$(sed -n 's#^FROM docker.io/library/mediawiki:\([0-9.]*\)@sha256:[0-9a-f]\{64\}$#\1#p' mediawiki/image/Dockerfile)"
          addon="$(sed -n 's/^version: *//p' mediawiki/papaia-app.yaml)"
          kit="$(python3 -c 'import tomllib; print(tomllib.load(open("kit.lock", "rb"))["version"])')"
          [[ -n "$mw" && -n "$addon" && -n "$kit" ]] || { echo "::error::cannot read the MediaWiki, add-on or kit version"; exit 1; }
          echo "tag=$mw-$addon" >> "$GITHUB_OUTPUT"
          echo "kit=$kit" >> "$GITHUB_OUTPUT"
      - name: Hold the compose default to a published tag and its digest
        id: pin
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_LINE: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          set -euo pipefail
          default="$(sed -n 's#^ *image: ${MEDIAWIKI_IMAGE:-\([^}]*\)}$#\1#p' mediawiki/docker-compose.yml)"
          # While a milestone is open, the default may name the signed release
          # candidate of exactly this tag in a local test registry (see
          # tools/image_refs.py). A runner cannot reach that registry, so only
          # the form and the tag are checked here; main and pull requests into
          # it refuse it.
          candidate='^127\.0\.0\.1:[0-9]{1,5}/unpublished/papaia-mediawiki:([A-Za-z0-9._-]+)@(sha256:[0-9a-f]{64})$'
          if [[ "$default" =~ $candidate ]]; then
            if [[ "$RELEASE_LINE" == "true" ]]; then
              echo "::error file=mediawiki/docker-compose.yml::MEDIAWIKI_IMAGE default names a test registry candidate ($default); pin the published $IMAGE:$TAG on the release line"
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" != "$TAG" ]]; then
              echo "::error file=mediawiki/docker-compose.yml::the candidate default is tag ${BASH_REMATCH[1]}, the Dockerfile and manifest give $TAG"
              exit 1
            fi
            echo "::notice::MEDIAWIKI_IMAGE default is the test registry candidate of $TAG; pin $IMAGE:$TAG with its digest once published"
            exit 0
          fi
          if [[ ! "$default" =~ ^${IMAGE//./\\.}:([A-Za-z0-9._-]+)@(sha256:[0-9a-f]{64})$ ]]; then
            echo "::error file=mediawiki/docker-compose.yml::MEDIAWIKI_IMAGE default must be $IMAGE:<tag>@sha256:<digest>, found '$default'"
            exit 1
          fi
          pinned_tag="${BASH_REMATCH[1]}" pinned_digest="${BASH_REMATCH[2]}"
          served="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$pinned_tag" | sha256sum | cut -d' ' -f1)"
          if [[ "$served" != "$pinned_digest" ]]; then
            echo "::error file=mediawiki/docker-compose.yml::$IMAGE:$pinned_tag is $served in the registry, the default pins $pinned_digest"
            exit 1
          fi
          if [[ "$pinned_tag" != "$TAG" ]]; then
            if docker buildx imagetools inspect --raw "$IMAGE:$TAG" >/dev/null 2>&1; then
              echo "::error file=mediawiki/docker-compose.yml::$IMAGE:$TAG is published; pin it as the default (tag and digest)"
              exit 1
            fi
            echo "::notice::$IMAGE:$TAG is not published yet; the default keeps $pinned_tag until it is"
          fi
      - name: Require a new add-on version for image changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE:mediawiki/papaia-app.yaml" 2>/dev/null || exit 0
          git diff --quiet "$BASE" HEAD -- mediawiki/image && exit 0
          old="$(git show "$BASE:mediawiki/papaia-app.yaml" | sed -n 's/^version: *//p')"
          new="$(sed -n 's/^version: *//p' mediawiki/papaia-app.yaml)"
          if [[ "$old" == "$new" ]]; then
            echo "::error file=mediawiki/papaia-app.yaml::mediawiki/image/ changed, so the add-on version ($new) must change too -- the image tag is derived from it"
            exit 1
          fi

  test:
    name: Build and scan (${{ matrix.platform }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        if: matrix.platform != 'linux/amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: mediawiki/image
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: ${{ env.IMAGE }}:${{ needs.check.outputs.tag }}
          labels: de.fidonis.platform-kit=${{ needs.check.outputs.kit }}
      - name: Access-tier checks
        if: matrix.platform == 'linux/amd64'
        run: mediawiki/tests/run.sh
      - name: Report file name
        id: name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "report=trivy-mediawiki-${PLATFORM#linux/}.json" >> "$GITHUB_OUTPUT"
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.check.outputs.tag }}
          version: ${{ env.TRIVY_VERSION }}
          scanners: vuln
          format: json
          output: ${{ steps.name.outputs.report }}
          exit-code: '0'
          timeout: 15m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: ${{ steps.name.outputs.report }}
          path: ${{ steps.name.outputs.report }}
          retention-days: 90
      - name: Gate self test (seeded critical finding must fail)
        run: |
          set -uo pipefail
          uv run --locked python tools/scan_gate.py tools/fixtures/scan/seeded-critical.json >/dev/null 2>&1
          status=$?
          if [[ $status -ne 1 ]]; then echo "::error::scan gate passed a seeded critical finding (exit $status)"; exit 1; fi
          echo "seeded critical finding rejected as expected"
      - name: Gate
        env:
          REPORT: ${{ steps.name.outputs.report }}
        run: uv run --locked python tools/scan_gate.py "$REPORT"

  publish:
    name: Publish, SBOM and signature
    needs: [check, test]
    # Only main and the milestone branches publish, also on a manual run: a
    # run on any other branch must not claim a tag before its code is merged.
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One publish per tag: a push to releases/x.y.z and the merge of that
    # branch into main would otherwise both pass the "already published" check
    # below and push the same tag. The later run waits and then verifies it.
    concurrency:
      group: mediawiki-image-publish-${{ needs.check.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is the tag published already
        id: exists
        run: |
          if docker buildx imagetools inspect --raw "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          [[ -n "$COSIGN_PRIVATE_KEY" && -n "$COSIGN_PASSWORD" && -n "$COSIGN_PUBLIC_KEY" ]] \
            || { echo "::error::COSIGN_PRIVATE_KEY, COSIGN_PASSWORD (secrets) and COSIGN_PUBLIC_KEY (variable) must be set"; exit 1; }
          printf '%s\n' "$COSIGN_PUBLIC_KEY" > cosign.pub
      # A published tag is left as it is, but it must carry the signature and
      # the SBOM attestation; otherwise this job fails on every run until a
      # new add-on version replaces the tag.
      - name: Verify the published tag
        if: steps.exists.outputs.published == 'true'
        run: |
          set -euo pipefail
          digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)"
          ref="$IMAGE@$digest"
          cosign() {
            docker run --rm --user "$(id -u):$(id -g)" -e COSIGN_REPOSITORY="$SIGNATURES" \
              -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" \
              -v "$PWD:/work:ro" -w /work "$COSIGN_IMAGE" "$@"
          }
          if ! cosign verify --key cosign.pub "$ref" >/dev/null \
            || ! cosign verify-attestation --key cosign.pub --type cyclonedx "$ref" >/dev/null; then
            echo "::error::$IMAGE:$TAG ($digest) is published without a valid signature or SBOM attestation; a published tag is not replaced, so publish a new add-on version"
            exit 1
          fi
          echo "$IMAGE:$TAG ($digest) is published, signed and attested; leaving it unchanged"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        if: steps.exists.outputs.published == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: steps.exists.outputs.published == 'false'
      # By digest only: no tag exists until every step below has passed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        if: steps.exists.outputs.published == 'false'
        with:
          context: mediawiki/image
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            de.fidonis.platform-kit=${{ needs.check.outputs.kit }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Platform manifests
        id: platforms
        if: steps.exists.outputs.published == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          for arch in amd64 arm64; do
            manifest="$(jq -r --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else "" end' <<<"$index")"
            [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no single linux/$arch manifest in $IMAGE@$DIGEST"; exit 1; }
            echo "$arch=$manifest" >> "$GITHUB_OUTPUT"
          done
      - name: Scan (amd64)
        if: steps.exists.outputs.published == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          version: ${{ env.TRIVY_VERSION }}
          scanners: vuln
          format: json
          output: trivy-mediawiki-amd64.json
          exit-code: '0'
          timeout: 15m
      - name: Scan (arm64)
        if: steps.exists.outputs.published == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          version: ${{ env.TRIVY_VERSION }}
          scanners: vuln
          format: json
          output: trivy-mediawiki-arm64.json
          exit-code: '0'
          timeout: 15m
      - name: Gate
        if: steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          uv run --locked python tools/scan_gate.py trivy-mediawiki-amd64.json
          uv run --locked python tools/scan_gate.py trivy-mediawiki-arm64.json
      - name: CycloneDX SBOM (amd64)
        if: steps.exists.outputs.published == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          version: ${{ env.TRIVY_VERSION }}
          format: cyclonedx
          output: sbom-amd64.cdx.json
          timeout: 15m
      - name: CycloneDX SBOM (arm64)
        if: steps.exists.outputs.published == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          version: ${{ env.TRIVY_VERSION }}
          format: cyclonedx
          output: sbom-arm64.cdx.json
          timeout: 15m
      # Signing writes into $SIGNATURES before the tag exists. GitHub offers no
      # way to test write access to another package without writing to it, so
      # missing access shows here, as a failed step that leaves no tag behind.
      - name: Sign, attach the SBOMs and verify
        if: steps.exists.outputs.published == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Key material reaches the container through the environment only.
          cosign() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD -e COSIGN_REPOSITORY="$SIGNATURES" \
              -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" \
              -v "$PWD:/work:ro" -w /work "$COSIGN_IMAGE" "$@"
          }
          index="$IMAGE@$DIGEST"
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$index"
          for arch in amd64 arm64; do
            if [[ "$arch" == amd64 ]]; then manifest="$IMAGE@$AMD64"; else manifest="$IMAGE@$ARM64"; fi
            for ref in "$manifest" "$index"; do
              cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type cyclonedx --predicate "sbom-$arch.cdx.json" "$ref"
            done
          done
          for ref in "$index" "$IMAGE@$AMD64" "$IMAGE@$ARM64"; do
            cosign verify --key cosign.pub "$ref" >/dev/null
            cosign verify-attestation --key cosign.pub --type cyclonedx "$ref" >/dev/null
          done
      - name: Tag the verified digest
        if: steps.exists.outputs.published == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          served="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)"
          if [[ "$served" != "$DIGEST" ]]; then
            echo "::error::$IMAGE:$TAG serves $served, not the signed $DIGEST"
            exit 1
          fi
          echo "::notice::published $IMAGE:$TAG@$DIGEST; pin it as the MEDIAWIKI_IMAGE default in mediawiki/docker-compose.yml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.exists.outputs.published == 'false'
        with:
          name: sbom-mediawiki-${{ env.TAG }}
          path: |
            sbom-*.cdx.json
            trivy-mediawiki-*.json
          retention-days: 90
