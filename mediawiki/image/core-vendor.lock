{
    "_readme": [
        "Exact upgrades of packages in the vendor directory of MediaWiki core",
        "(/var/www/html/vendor) that the base image does not carry in a fixed",
        "version yet, in the package form of composer.lock. mediawiki/image/Dockerfile",
        "installs each entry from this file alone (no other repository) and Composer",
        "checks the dist archive against its sha1 `shasum`. The comment block above",
        "that step names each package, version and advisory."
    ],
