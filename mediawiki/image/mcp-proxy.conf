# papaia-addon-mediawiki — publish the MCP server under the wiki's origin.
#
# Host is preserved: the MCP server checks it against the host of its public
# URL. Responses are flushed as they arrive, so streamed (SSE) replies are
# not held back. disablereuse makes Apache look the upstream up again for
# each connection, so a recreated MCP container with a new address is found.
ProxyPreserveHost On
ProxyTimeout 300
ProxyPass        /mcp  http://mediawiki-mcp:8080/mcp  flushpackets=on disablereuse=On
ProxyPassReverse /mcp  http://mediawiki-mcp:8080/mcp
ProxyPass        /.well-known/oauth-protected-resource   http://mediawiki-mcp:8080/.well-known/oauth-protected-resource disablereuse=On
ProxyPass        /.well-known/oauth-authorization-server http://mediawiki-mcp:8080/.well-known/oauth-authorization-server disablereuse=On
