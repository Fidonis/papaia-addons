# papaia-addon-mediawiki — TLS on the published port.
#
# Serves the same document root as the plain-http default site. The key pair
# is provided by the entrypoint on every start: signed by the papaia local CA
# when one is mounted, self-signed otherwise.
<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /var/lib/papaia-mediawiki-tls/tls.crt
    SSLCertificateKeyFile /var/lib/papaia-mediawiki-tls/tls.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off
</VirtualHost>
