# Nginx Proxy Manager — MediaWiki proxy host configuration reference
#
# Use this as a guide when adding the MediaWiki proxy host via the NPM web UI
# (or NPM API). Replace the server_name with the host part of MW_SERVER.
#
# For raw nginx (without NPM), this can be used as a server block snippet.
#
# Nothing needs to be stripped or injected: the wiki authenticates its own
# sessions (Keycloak login via PluggableAuth) and trusts no identity header.
#
# The MCP server is served by the wiki container itself under /mcp and the
# /.well-known/oauth-* discovery paths, so this one host covers both. Its
# public URL (MEDIAWIKI_MCP_PUBLIC_URL) is then https://<this host>/mcp.
# Keep the Authorization header intact on that path: it carries the MCP
# server's own tokens.

server {
    listen 443 ssl;
    server_name wiki.example.com;  # Replace with the host part of MW_SERVER

    # TLS — managed by NPM or your own certificate provider
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    location / {
        proxy_pass         http://mediawiki:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Uploads -- keep at or above MW_MAX_UPLOAD_MB (the image caps
        # PHP at 100 MB).
        client_max_body_size 100m;

        # VisualEditor saves and long parses can take a while on large pages.
        proxy_read_timeout 120s;
    }

    # MCP: streamed responses must reach the client as they are written.
    location /mcp {
        proxy_pass         http://mediawiki:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
