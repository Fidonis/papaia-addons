# Nginx Proxy Manager — n8n proxy host configuration reference
#
# Use this as a guide when adding the n8n proxy host via the NPM web UI
# (or NPM API). Replace the server_name with the hostname of N8N_PUBLIC_URL.
#
# For raw nginx (without NPM), this can be used as a server block snippet.
#
# Note the upstream: requests go to n8n-auth, the SSO gate — never to the
# n8n container directly. Bypassing the gate would publish an unauthenticated
# editor, since n8n Community Edition has no login of its own.

server {
    listen 443 ssl;
    server_name automation.example.com;  # Replace with your N8N_PUBLIC_URL hostname

    # TLS — managed by NPM or your own certificate provider
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    location / {
        proxy_pass         http://n8n-auth:4180;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The editor holds a websocket open for execution progress.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Workflow runs stream their output; buffering would delay it until
        # the run completes.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Binary data in workflow payloads (attachments, generated files)
        client_max_body_size 100m;

        # Strip proxy-injected identity headers arriving from outside
        # (defense-in-depth — the gate sets them itself).
        proxy_set_header   X-Auth-Request-User  "";
        proxy_set_header   X-Auth-Request-Email "";
        proxy_set_header   X-Forwarded-User     "";

        # The gate matches its webhook exemptions against the request path; a
        # client-supplied X-Forwarded-Uri must never be able to stand in for
        # it (CVE-2026-40575). The gate ignores the header as shipped -- this
        # keeps it that way should an override re-enable --reverse-proxy.
        proxy_set_header   X-Forwarded-Uri      "";
    }
}
