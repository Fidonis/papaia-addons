# ═══════════════════════════════════════════════════════════════════════════
# papaia-addon-n8n — logout shim
# by Fidonis GmbH · https://fidonis.de
#
# Sits between n8n-auth (oauth2-proxy) and the n8n engine. Its only job is to
# turn n8n's post-logout redirect into an oauth2-proxy sign-out, so logging
# out of n8n also ends the SSO session instead of silently re-entering the
# editor on the still-valid proxy cookie.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf. Override the source
# path via N8N_PROXY_CONF to customise without editing the add-on.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 5679;

    # Container-local liveness probe. Never reached through the gate:
    # oauth2-proxy serves its own routes and forwards everything else.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # n8n sends the browser to /signin after logout. Intercept it and hand
    # the user to oauth2-proxy's sign_out, which clears the session cookie
    # and forces a fresh Keycloak login on the next visit.
    location = /signin {
        return 302 /oauth2/sign_out?rd=%2F;
    }

    location / {
        proxy_pass         http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # The editor keeps a websocket open for push updates; without the
        # upgrade headers it falls back to polling and the UI feels broken.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Workflow executions stream their log; buffering would hold the
        # response until completion.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Binary data in workflow payloads (attachments, generated files).
        client_max_body_size 100m;
    }
}
