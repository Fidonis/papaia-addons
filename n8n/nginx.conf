# ═══════════════════════════════════════════════════════════════════════════
# papaia-addon-n8n — logout shim
# by Fidonis GmbH · https://fidonis.de
#
# Sits between n8n-auth (oauth2-proxy) and the n8n engine. Its only job is to
# turn n8n's post-logout page load into an RP-initiated logout at Keycloak,
# which then returns to the gate's sign_out. Logging out of n8n therefore
# ends the SSO session and clears the gate cookie, instead of silently
# re-entering the editor on either of them.
#
# An envsubst template, not a plain config: the image renders it to
# /etc/nginx/conf.d/default.conf at start and substitutes only N8N_LOGOUT_*
# (NGINX_ENVSUBST_FILTER in docker-compose.yml), so nginx's own $variables
# pass through. Override the source path via N8N_PROXY_CONF to customise
# without editing the add-on.
# ═══════════════════════════════════════════════════════════════════════════

# n8n reads the client's scheme from X-Forwarded-Proto. The gate forwards
# whatever an edge proxy sent; with none in front there is no header at all,
# so fall back to this hop's own scheme rather than forwarding an empty one.
map $http_x_forwarded_proto $n8n_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 5679;

    # Container-local liveness probe. Never reached through the gate:
    # oauth2-proxy serves its own routes and forwards everything else.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # n8n loads /signin as a full page after logout -- not a client-side
    # route change -- so the request does reach this shim. Hand it to
    # Keycloak's end-session endpoint; Keycloak returns to /oauth2/sign_out,
    # which clears the gate cookie, and the next visit is a fresh login.
    location = /signin {
        return 302 "${N8N_LOGOUT_URL}";
    }

    location / {
        proxy_pass         http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $n8n_forwarded_proto;

        # The editor keeps a websocket open for push updates; without the
        # upgrade headers it falls back to polling and the UI feels broken.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Workflow executions stream their log; buffering would hold the
        # response until completion.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Binary data in workflow payloads (attachments, generated files).
        client_max_body_size 100m;
    }
}
