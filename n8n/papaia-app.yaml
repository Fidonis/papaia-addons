name: n8n
version: 1.0.0
addon_repo: papaia-addon-n8n
requires:
  # Contract generation this addon is built against; checked against the
  # core's ADDON_API window by cores that support compatibility gating.
  addon_api: 1
# Fallback axis for cores that do not read `requires` yet. 1.0.0 is the floor:
# the SSO gate consumes the split OIDC endpoints under their current names
# (OIDC_AUTH_URL / OIDC_TOKEN_URL / OIDC_JWKS_URL), which earlier cores
# published under different keys.
papaia_compat: ">=1.0.0"
description: "n8n workflow automation behind a Keycloak SSO gate"

networks:
  app_network: papaia-n8n-net
  # nginx-proxy-manager publishes the browser-facing editor. LibreChat is
  # deliberately absent: this add-on ships no MCP server, so nothing in the
  # core needs to reach n8n over the Docker network. Workflows call out to
  # the core's public endpoints (LiteLLM, LibreChat) the same way they call
  # any other HTTP API.
  attach: [nginx-proxy-manager]

# Env vars pointing at the bundled-Keycloak CA cert (mounted from
# $PAPAIA_CONFIG_DIR/certs). papaia-ctl clears them via a generated override
# when auth_provider=external_oidc, so the gate falls back to the system CA
# bundle instead of failing on the absent local-ca.crt.
local_ca_env:
  n8n-auth: [SSL_CERT_FILE]

# Per-variable metadata: label (human-readable prompt text), hint (secondary
# explanation), default (overrides .env.example value), default_from_core
# (pulls value from core .env by key name), type (text|integer|url|decimal),
# secret (bool — true forces masking, false opts out of name heuristic),
# min/max (numeric bounds for integer/decimal), pattern (regex for text).
# All fields are optional; add-ons without env_prompts entries continue to
# work unchanged (readers ignore unknown manifest keys).
env_prompts:

  # ── Core OIDC ─────────────────────────────────────────────────────────────
  PAPAIA_CONFIG_DIR:
    label: "papAIa config directory"
    hint: "Path to the directory created by papaia-ctl setup (PAPAIA_CONFIG_DIR)"
    default_from_core: PAPAIA_CONFIG_DIR
    type: text

  OIDC_ISSUER:
    label: "Keycloak issuer URL"
    hint: "Browser-facing URL, must match OIDC_ISSUER from core setup"
    default_from_core: OIDC_ISSUER
    type: url

  OIDC_AUTH_URL:
    label: "Keycloak authorization endpoint"
    hint: "Browser-facing login redirect; must be reachable from the user's browser"
    default_from_core: OIDC_AUTH_URL
    type: url

  OIDC_TOKEN_URL:
    label: "Keycloak token endpoint"
    hint: "Server-side token exchange; stays on internal Docker DNS"
    default_from_core: OIDC_TOKEN_URL
    type: url

  OIDC_JWKS_URL:
    label: "Keycloak JWKS endpoint"
    hint: "Server-side key fetch for token verification; internal Docker DNS"
    default_from_core: OIDC_JWKS_URL
    type: url

  OIDC_SCOPES:
    label: "OIDC scopes"
    default_from_core: OIDC_SCOPES
    type: text

  # ── n8n — Public URL ──────────────────────────────────────────────────────
  N8N_PUBLIC_URL:
    label: "n8n public URL"
    hint: "Browser-facing URL of the editor (scheme + host + optional port); every webhook URL is derived from it"
    default: "http://host.docker.internal:8400"
    type: url

  N8N_HOSTNAME:
    label: "n8n hostname"
    hint: "Host part of the public URL only — no scheme, no port"
    default: "host.docker.internal"
    type: text

  N8N_PROTOCOL:
    label: "n8n protocol"
    hint: "Scheme of the public URL: https or http"
    default: "http"
    type: text

  N8N_PROXY_HOPS:
    label: "Reverse-proxy hops"
    hint: "2 with the bundled chain; add one per extra proxy in front (e.g. NPM)"
    type: integer
    min: 0

  # ── n8n — Database ────────────────────────────────────────────────────────
  N8N_DB:
    label: "Database name"
    type: text

  N8N_DBUSER:
    label: "Database user"
    type: text

  N8N_DBPASS:
    label: "Database password"
    secret: true    # name heuristic misses DBPASS; auto-generated by seed_addon_env

  # ── n8n — Credential encryption ───────────────────────────────────────────
  N8N_ENCRYPTION_KEY:
    label: "Credential encryption key"
    hint: "Encrypts stored workflow credentials; keep it with the backup and never rotate while credentials exist"
    secret: true

  # ── Keycloak OIDC client ──────────────────────────────────────────────────
  N8N_OIDC_CLIENT_ID:
    label: "Keycloak client ID"
    hint: "Must match the clientId of the imported n8n client"
    type: text

  KC_N8N_CLIENT_SECRET:
    label: "Keycloak client secret (n8n)"
    hint: "Copy from Keycloak Admin UI → Clients → n8n → Credentials → Client Secret"
    secret: true

  # ── SSO gate ──────────────────────────────────────────────────────────────
  N8N_COOKIE_SECRET:
    label: "Session cookie secret"
    hint: "32-byte base64 value signing the SSO session cookie; auto-generated on install"
    secret: true

  N8N_COOKIE_SECURE:
    label: "Mark session cookie as Secure"
    hint: "true when the public URL uses HTTPS — browsers ignore Secure cookies over plain HTTP"
    default_from_core: OAUTH2_PROXY_COOKIE_SECURE
    type: text

  N8N_EXT_PORT:
    label: "n8n host port"
    hint: "Port of the SSO gate — the only published port; must match the port in N8N_PUBLIC_URL"
    type: integer
    min: 1
    max: 65535

  # ── n8n — Behaviour ───────────────────────────────────────────────────────
  TIMEZONE:
    label: "Timezone"
    hint: "IANA name, e.g. Europe/Berlin — drives cron triggers and timestamps"
    type: text

  N8N_DIAGNOSTICS_ENABLED:
    label: "Enable n8n telemetry"
    hint: "false keeps a self-hosted deployment from phoning home"
    type: text

  N8N_LOG_LEVEL:
    label: "Log level"
    hint: "One of: error, warn, info, verbose, debug, silent"
    type: text

env_replace_secrets:
  KC_N8N_CLIENT_SECRET:
    hint: "Keycloak Admin UI → Clients → n8n → Credentials → Client Secret"

integration:
  keycloak:
    clients:
      - integration/infra/keycloak/n8n.json
  nginx: integration/infra/nginx/n8n.conf
