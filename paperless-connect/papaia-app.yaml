name: paperless-connect
version: 1.1.0
addon_repo: papaia-addon-paperless-connect
requires:
  # Contract generation this addon is built against; checked against the
  # core's ADDON_API window by cores that support compatibility gating.
  # 2: networks.app_network carries a ${PAPAIA_PROJECT:-papaia} template
  # that the core resolves against its .env (needs a core serving addon_api 2).
  addon_api: 2
# Fallback axis for cores that do not read `requires` yet.
papaia_compat: ">=0.8.0"
description: "OIDC/RBAC MCP server for an existing standalone Paperless-ngx instance"

networks:
  # Resolved by papaia-ctl against the core .env, matching the add-on's own
  # compose network name. Scopes the Seam-1 bridge per deployment; a default
  # single-stack host resolves it to papaia-paperless-connect-net.
  app_network: "${PAPAIA_PROJECT:-papaia}-paperless-connect-net"
  attach: [librechat]

# SSL_CERT_FILE defaults to empty (system trust store) in docker-compose.yml;
# it is opt-in via PAPERLESS_MCP_SSL_CERT_FILE for a local-dev core whose
# Keycloak uses the bundled self-signed CA. This entry additionally makes
# papaia-ctl force it empty via a generated override when
# auth_provider=external_oidc, where $PAPAIA_CONFIG_DIR/certs is absent.
local_ca_env:
  paperless-mcp: [SSL_CERT_FILE]

# Per-variable metadata: label (human-readable prompt text), hint (secondary
# explanation), default (overrides .env.example value), default_from_core
# (pulls value from core .env by key name), type (text|integer|url|decimal),
# secret (bool — true forces masking, false opts out of name heuristic),
# min/max (numeric bounds for integer/decimal), pattern (regex for text).
# All fields are optional; add-ons without env_prompts entries continue to
# work unchanged (readers ignore unknown manifest keys).
env_prompts:

  # ── Core OIDC ─────────────────────────────────────────────────────────────
  PAPAIA_CONFIG_DIR:
    label: "papAIa config directory"
    hint: "Path to the directory created by papaia-ctl setup (PAPAIA_CONFIG_DIR)"
    default_from_core: PAPAIA_CONFIG_DIR
    type: text

  OIDC_ISSUER:
    label: "Keycloak issuer URL"
    hint: "Browser-facing URL, must match OIDC_ISSUER from core setup"
    default_from_core: OIDC_ISSUER
    type: url

  # ── MCP server ────────────────────────────────────────────────────────────
  PAPERLESS_MCP_OIDC_AUDIENCE:
    label: "MCP server token audience"
    hint: "Must match the mcp-paperless-audience mapper on the LibreChat Keycloak client"
    type: text

  PAPERLESS_MCP_OIDC_JWKS_CACHE_TTL:
    label: "JWKS cache TTL (seconds)"
    type: integer
    min: 0

  PAPERLESS_MCP_SSL_CERT_FILE:
    label: "Extra CA file for the MCP server's outbound TLS"
    hint: "Leave empty for publicly-trusted Keycloak/Paperless certificates (the common case, a published bundled Keycloak included); set to /certs/local-ca.crt only for a local-dev core using the bundled self-signed Keycloak CA"
    type: text

  PAPERLESS_MCP_PAPERLESS_URL:
    label: "Paperless URL"
    hint: "URL of the existing Paperless instance as reachable from the MCP container — often the public URL (e.g. https://docs.example.com)"
    type: url

  PAPERLESS_MCP_REMOTE_USER_HEADER:
    label: "Remote-user header name"
    type: text

  PAPERLESS_MCP_USERNAME_CLAIM:
    label: "Username JWT claim"
    type: text

  PAPERLESS_MCP_HTTP_TIMEOUT:
    label: "MCP HTTP timeout (seconds)"
    type: integer
    min: 1

  PAPERLESS_MCP_MAX_DOWNLOAD_BYTES:
    label: "MCP maximum download size (bytes)"
    type: integer
    min: 1

  PAPERLESS_MCP_PORT:
    label: "MCP server port"
    type: integer
    min: 1
    max: 65535

  PAPERLESS_MCP_PATH:
    label: "MCP endpoint path"
    type: text

  PAPERLESS_MCP_LOG_LEVEL:
    label: "MCP log level"
    hint: "One of: DEBUG, INFO, WARNING, ERROR"
    type: text

integration:
  keycloak:
    clients:
      - integration/infra/keycloak/mcp-paperless.json
    client_mappers:
      librechat:
        - integration/infra/keycloak/librechat-audience-mapper.json
  librechat: integration/ai/librechat/librechat.yaml
