# ═══════════════════════════════════════════════════════════════════════════
# papaia-ext-paperless — Docker Compose
# by Fidonis GmbH · https://fidonis.de
#
# Paperless-ngx document management with OIDC SSO and an OIDC/RBAC-secured
# MCP server for AI-assisted document access via LibreChat.
#
# All services run on the isolated papaia-paperless-net bridge network.
# papaia-ctl generates a compose override that attaches nginx and librechat
# to this network (Seam 1). External access via the Nginx Proxy Manager
# (Seam 5 — see integration/infra/nginx/paperless.conf and README.md).
#
# env_file reads from .env in the same directory as this file, seeded by
# `papaia-ctl apps integrate paperless`.
# ═══════════════════════════════════════════════════════════════════════════
services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  WEBSERVER — Paperless-ngx application
  #
  #  Document ingestion, OCR, full-text indexing, and web UI.
  #  Native OIDC login via Keycloak (django-allauth openid_connect provider);
  #  no oauth2-proxy sidecar needed.
  #
  #  extra_hosts enables host.docker.internal on Linux hosts so the container
  #  can reach Keycloak's external port for OIDC token validation and login.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless:
    image: ${PAPERLESS_IMAGE:-ghcr.io/paperless-ngx/paperless-ngx:2.20.10}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS:                         redis://paperless-broker:6379
      PAPERLESS_DBHOST:                        paperless-db
      PAPERLESS_TIKA_ENABLED:                  ${PAPERLESS_TIKA_ENABLED:-1}
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT:       http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT:                 http://paperless-tika:9998
      # Public URL — must match registered redirect URIs in Keycloak
      PAPERLESS_URL:                           ${PAPERLESS_PUBLIC_URL}
      PAPERLESS_TIME_ZONE:                     ${TIMEZONE:-Europe/Berlin}
      # OIDC via Keycloak (django-allauth openid_connect)
      # server_url must be the browser-facing Keycloak issuer so iss claim matches.
      PAPERLESS_APPS:                          allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "keycloak",
        "name": "Keycloak", "client_id": "paperless",
        "secret": "${KC_PAPERLESS_CLIENT_SECRET}",
        "settings": {"server_url": "${OIDC_ISSUER}"}}]}}
      # Login behaviour — see .env for toggle options
      PAPERLESS_REDIRECT_LOGIN_TO_SSO:         ${PAPERLESS_REDIRECT_LOGIN_TO_SSO:-false}
      PAPERLESS_LOGOUT_REDIRECT_URL:           "${OIDC_ISSUER}/protocol/openid-connect/logout?client_id=paperless&post_logout_redirect_uri=${PAPERLESS_PUBLIC_URL}"
      PAPERLESS_SOCIAL_AUTO_SIGNUP:            ${PAPERLESS_SOCIAL_AUTO_SIGNUP:-true}
      # Keycloak realm-role → Paperless group sync
      PAPERLESS_SOCIAL_ACCOUNT_GROUPS_SYNC:    ${PAPERLESS_SOCIAL_ACCOUNT_GROUPS_SYNC:-true}
      PAPERLESS_SOCIAL_ACCOUNT_GROUPS_CLAIM:   ${PAPERLESS_SOCIAL_ACCOUNT_GROUPS_CLAIM:-groups}
      PAPERLESS_SOCIAL_ACCOUNT_ADMIN_GROUP:    ${PAPERLESS_SOCIAL_ACCOUNT_ADMIN_GROUP:-admin}
      PAPERLESS_DISABLE_REGULAR_LOGIN:         ${PAPERLESS_DISABLE_REGULAR_LOGIN:-false}
      PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: ${PAPERLESS_HTTP_PROTOCOL:-http}
      # Bootstrap superuser (local account, break-glass access only)
      PAPERLESS_ADMIN_USER:                    ${PAPERLESS_ADMIN_USER:-paperless-admin}
      PAPERLESS_ADMIN_PASSWORD:                ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL:                    ${PAPERLESS_ADMIN_MAIL:-admin@localhost}
      # Remote-user auth — allows paperless-mcp to act on behalf of the logged-in
      # user without admin credentials. Header value must match the Paperless
      # username assigned during the user's initial OIDC web login.
      PAPERLESS_ENABLE_HTTP_REMOTE_USER:       "true"
      PAPERLESS_ENABLE_HTTP_REMOTE_USER_API:   "true"
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME:  "HTTP_X_PAPAIA_REMOTE_USER"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - paperless-db
      - paperless-broker
      - paperless-gotenberg
      - paperless-tika
    ports:
      - "${HOST_IP:-0.0.0.0}:${PAPERLESS_EXT_PORT:-8010}:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - ${MEDIA_DIRECTORY:-./data/media}:/usr/src/paperless/media
      - ${EXPORT_DIRECTORY:-./data/export}:/usr/src/paperless/export
      - ${CONSUME_DIRECTORY:-./data/consume}:/usr/src/paperless/consume
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: webserver

  # ═══════════════════════════════════════════════════════════════════════════
  #  MCP SERVER — OIDC/RBAC-secured Paperless proxy
  #
  #  Validates the caller's Keycloak Bearer token and forwards Paperless-ngx
  #  API requests via X-Papaia-Remote-User so Paperless enforces per-user RBAC.
  #  No admin credentials stored here.
  #
  #  LibreChat connects via the generated Seam-1 network override
  #  (papaia-paperless-net attached to the librechat container). OIDC token
  #  validation reaches Keycloak at OIDC_ISSUER via extra_hosts.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-mcp:
    image: ${PAPERLESS_MCP_IMAGE:-ghcr.io/fidonis/paperless-mcp-rbac:0.1.0}
    restart: unless-stopped
    environment:
      OIDC_ISSUER_URL:              ${OIDC_ISSUER}
      OIDC_AUDIENCE:                ${PAPERLESS_MCP_OIDC_AUDIENCE:-mcp-paperless}
      OIDC_JWKS_CACHE_TTL:          ${PAPERLESS_MCP_OIDC_JWKS_CACHE_TTL:-3600}
      PAPERLESS_URL:                ${PAPERLESS_MCP_PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_REMOTE_USER_HEADER: ${PAPERLESS_MCP_REMOTE_USER_HEADER:-X-Papaia-Remote-User}
      PAPERLESS_USERNAME_CLAIM:     ${PAPERLESS_MCP_USERNAME_CLAIM:-preferred_username}
      PAPERLESS_HTTP_TIMEOUT:       ${PAPERLESS_MCP_HTTP_TIMEOUT:-30}
      PAPERLESS_MAX_DOWNLOAD_BYTES: ${PAPERLESS_MCP_MAX_DOWNLOAD_BYTES:-10485760}
      MCP_HOST:                     ${PAPERLESS_MCP_HOST:-0.0.0.0}
      MCP_PORT:                     ${PAPERLESS_MCP_PORT:-8000}
      MCP_PATH:                     ${PAPERLESS_MCP_PATH:-/mcp}
      LOG_LEVEL:                    ${PAPERLESS_MCP_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - paperless
    networks:
      - papaia-paperless-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: mcp-server

  # ═══════════════════════════════════════════════════════════════════════════
  #  BROKER — Redis message queue (Celery task broker)
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-broker:
    image: ${PAPERLESS_REDIS_IMAGE:-docker.io/library/redis:8}
    restart: unless-stopped
    volumes:
      - paperless-redisdata:/data
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: broker

  # ═══════════════════════════════════════════════════════════════════════════
  #  DATABASE — PostgreSQL
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-db:
    image: ${PAPERLESS_DB_IMAGE:-docker.io/library/postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PAPERLESS_DB:-paperless}
      POSTGRES_USER:     ${PAPERLESS_DBUSER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS}
    volumes:
      - paperless-pgdata:/var/lib/postgresql
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: database

  # ═══════════════════════════════════════════════════════════════════════════
  #  GOTENBERG — Document conversion (Office, email → PDF)
  #
  #  JavaScript disabled; only file:// URLs allowed to prevent SSRF.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-gotenberg:
    image: ${PAPERLESS_GOTENBERG_IMAGE:-docker.io/gotenberg/gotenberg:8.27}
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: document-converter

  # ═══════════════════════════════════════════════════════════════════════════
  #  TIKA — Text extraction (Office documents, emails, and other formats)
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-tika:
    image: ${PAPERLESS_TIKA_IMAGE:-docker.io/apache/tika:3.2.3.0}
    restart: unless-stopped
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: text-extractor

networks:
  papaia-paperless-net:
    driver: bridge
    name: papaia-paperless-net

volumes:
  paperless-data:
  paperless-pgdata:
  paperless-redisdata:
