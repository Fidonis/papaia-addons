# ═══════════════════════════════════════════════════════════════════════════
# papaia-addon-paperless — Docker Compose
# by Fidonis GmbH · https://fidonis.de
#
# Paperless-ngx document management with OIDC SSO and an OIDC/RBAC-secured
# MCP server for AI-assisted document access via LibreChat.
#
# All services run on the isolated papaia-paperless-net bridge network.
# papaia-ctl attaches the Nginx Proxy Manager to it (Seam 1); LibreChat joins
# only the front network, where the MCP server is the one member. Paperless
# listens on the loopback of its container and publishes no port: the only way
# in is paperless-gate on port 8001, which passes a request only with the
# secret of one of its callers (the proxy, the MCP server). Browser access goes
# through the proxy (Seam 5 — see integration/infra/nginx/paperless.conf and
# README.md).
#
# env_file reads from .env in the same directory as this file, materialized
# from the config bundle by `papaia-ctl addon start paperless`.
# ═══════════════════════════════════════════════════════════════════════════
services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  WEBSERVER — Paperless-ngx application
  #
  #  Document ingestion, OCR, full-text indexing, and web UI.
  #  Native OIDC login via Keycloak (django-allauth openid_connect provider);
  #  no oauth2-proxy sidecar needed.
  #
  #  extra_hosts enables host.docker.internal on Linux hosts so the container
  #  can reach Keycloak's external port for OIDC token validation and login.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless:
    image: ${PAPERLESS_IMAGE:-ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS:                         redis://paperless-broker:6379
      # Required since Paperless-ngx 3.0 — the engine is no longer inferred
      # from PAPERLESS_DBHOST, and the fallback is SQLite.
      PAPERLESS_DBENGINE:                      postgresql
      PAPERLESS_DBHOST:                        paperless-db
      PAPERLESS_TIKA_ENABLED:                  ${PAPERLESS_TIKA_ENABLED:-1}
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT:       http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT:                 http://paperless-tika:9998
      # Public URL — must match registered redirect URIs in Keycloak
      PAPERLESS_URL:                           ${PAPERLESS_PUBLIC_URL}
      PAPERLESS_TIME_ZONE:                     ${TIMEZONE:-Europe/Berlin}
      # Loopback only: every other container, the host network included,
      # reaches Paperless through paperless-gate (port 8001) or not at all.
      PAPERLESS_BIND_ADDR:                     "127.0.0.1"
      # OIDC via Keycloak (django-allauth openid_connect)
      # server_url must be the browser-facing Keycloak issuer so iss claim matches.
      # token_auth_method is explicit because allauth otherwise picks a method the
      # Keycloak client (clientAuthenticatorType: client-secret) rejects with
      # invalid_client at the callback.
      PAPERLESS_APPS:                          allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "keycloak",
        "name": "Keycloak", "client_id": "paperless",
        "secret": "${KC_PAPERLESS_CLIENT_SECRET}",
        "settings": {"server_url": "${OIDC_ISSUER}",
        "token_auth_method": "client_secret_basic"}}]}}
      # Login behaviour — see .env for toggle options
      PAPERLESS_REDIRECT_LOGIN_TO_SSO:         ${PAPERLESS_REDIRECT_LOGIN_TO_SSO:-false}
      PAPERLESS_LOGOUT_REDIRECT_URL:           "${OIDC_ISSUER}/protocol/openid-connect/logout?client_id=paperless&post_logout_redirect_uri=${PAPERLESS_PUBLIC_URL}"
      PAPERLESS_SOCIAL_AUTO_SIGNUP:            ${PAPERLESS_SOCIAL_AUTO_SIGNUP:-true}
      # Keycloak realm-role → Paperless group sync. Only groups that already
      # exist in Paperless are matched; the sync does not create them.
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS:       ${PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS:-true}
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM: ${PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM:-groups}
      PAPERLESS_DISABLE_REGULAR_LOGIN:         ${PAPERLESS_DISABLE_REGULAR_LOGIN:-false}
      PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: ${PAPERLESS_HTTP_PROTOCOL:-http}
      # Reverse-proxy awareness (PAPERLESS_TRUSTED_PROXIES,
      # PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT) is opt-in via .env — Paperless
      # parses the count with int(), so an empty value here would abort startup.
      # Bootstrap superuser (local account, break-glass access only)
      PAPERLESS_ADMIN_USER:                    ${PAPERLESS_ADMIN_USER:-paperless-admin}
      PAPERLESS_ADMIN_PASSWORD:                ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL:                    ${PAPERLESS_ADMIN_MAIL:-admin@localhost}
      # Remote-user auth — allows paperless-mcp to act on behalf of the logged-in
      # user without admin credentials. Header value must match the Paperless
      # username assigned during the user's initial OIDC web login. Only the
      # MCP server's requests carry it past paperless-gate; the gate clears it
      # on every other request.
      PAPERLESS_ENABLE_HTTP_REMOTE_USER:       "true"
      PAPERLESS_ENABLE_HTTP_REMOTE_USER_API:   "true"
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME:  "HTTP_X_PAPAIA_REMOTE_USER"
      # CA cert for Python requests — trusts the bundled Keycloak self-signed cert.
      # Cleared to "" via overrides/addons/ when auth_provider=external_oidc.
      REQUESTS_CA_BUNDLE: /certs/local-ca.crt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - paperless-db
      - paperless-broker
      - paperless-gotenberg
      - paperless-tika
    volumes:
      - ${PAPAIA_CONFIG_DIR}/certs:/certs:ro
      - paperless-data:/usr/src/paperless/data
      - ${MEDIA_DIRECTORY:-./data/media}:/usr/src/paperless/media
      - ${EXPORT_DIRECTORY:-./data/export}:/usr/src/paperless/export
      - ${CONSUME_DIRECTORY:-./data/consume}:/usr/src/paperless/consume
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: webserver

  # ═══════════════════════════════════════════════════════════════════════════
  #  GATE — the only way to Paperless
  #
  #  Runs in Paperless' network namespace and listens on port 8001 (reached as
  #  paperless:8001). A request passes only when X-Papaia-Gate carries the
  #  secret of a caller: the proxy's (written by papaia-ctl, mounted read-only)
  #  or the MCP server's (generated by the gate on first start into the
  #  paperless-gate-mcp volume). Without a secret: 403. The gate drops
  #  X-Papaia-Gate before Paperless and forwards X-Papaia-Remote-User only for
  #  the MCP server, and only for a name on the list the realm sync writes
  #  (directory mounted read-only, reread every 5 s); any other name: 403
  #  paperless_unknown_user and one papaia.audit/1 row. Its log names the
  #  caller, never a secret, path or name.
  #
  #  Stock nginx; the configuration and gate.sh are mounted from ./gate. The
  #  master runs as root with only these capabilities: reading the proxy's
  #  secret (a 0600 file of the account running papaia-ctl) and handing its
  #  temporary directories to the unprivileged worker it switches to. The root
  #  file system is read-only; only /tmp (memory) and the MCP secret volume are
  #  writable.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-gate:
    image: ${PAPERLESS_GATE_IMAGE:-docker.io/library/nginx:1.31.10-alpine@sha256:aceb952b920393b7d0bc7b978927fc283370bea89fb082c6fef0ce18c60f96a9}
    restart: unless-stopped
    network_mode: service:paperless
    entrypoint: ["/bin/sh", "/gate/gate.sh"]
    command: ["run"]
    depends_on:
      - paperless
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=16m
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    volumes:
      - type: bind
        source: ./gate
        target: /gate
        read_only: true
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/secrets/paperless-gate/proxy
        target: /run/paperless-gate/callers/proxy
        read_only: true
        bind:
          # Written by papaia-ctl setup; without it the gate does not start.
          create_host_path: false
      - type: volume
        source: paperless-gate-mcp
        target: /run/paperless-gate/callers/mcp
      # The directory, not users.json: the realm sync renames a new list into
      # place, and a bind mount of the file would keep showing the old one.
      - type: bind
        source: ${PAPAIA_CONFIG_DIR}/security/paperless-gate
        target: /run/paperless-gate/users
        read_only: true
        bind:
          # Written by papaia-ctl realm sync; without it the gate does not start.
          create_host_path: false
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: gate

  # ═══════════════════════════════════════════════════════════════════════════
  #  MCP SERVER — OIDC/RBAC-secured Paperless proxy
  #
  #  Validates the caller's Keycloak Bearer token and forwards Paperless-ngx
  #  API requests via X-Papaia-Remote-User so Paperless enforces per-user RBAC.
  #  No admin credentials stored here.
  #
  #  LibreChat reaches it over the front network (papaia-ctl attaches the
  #  librechat container there, never to papaia-paperless-net). It calls
  #  Paperless through paperless-gate with its own secret, read from the
  #  paperless-gate-mcp volume. OIDC token validation reaches Keycloak at
  #  OIDC_ISSUER via extra_hosts.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-mcp:
    # Release candidate of paperless-mcp-rbac 0.2.0 from a local test
    # registry, pinned by its digest; `tools/image_refs.py release` refuses
    # it, so the published 0.2.0 replaces it before this add-on is released.
    image: ${PAPERLESS_MCP_IMAGE:-127.0.0.1:57500/unpublished/paperless-mcp-rbac:0.2.0-rc.2@sha256:d417014920e674bffb5fe08cacddd5737876d2d0e0cf32ecbd0d52b9a4c6b1fa}
    restart: unless-stopped
    environment:
      OIDC_ISSUER_URL:              ${OIDC_ISSUER}
      OIDC_AUDIENCE:                ${PAPERLESS_MCP_OIDC_AUDIENCE:-mcp-paperless}
      OIDC_JWKS_CACHE_TTL:          ${PAPERLESS_MCP_OIDC_JWKS_CACHE_TTL:-3600}
      PAPERLESS_URL:                ${PAPERLESS_MCP_PAPERLESS_URL:-http://paperless:8001}
      PAPERLESS_GATE_SECRET_FILE:   /run/papaia/secrets/paperless-gate/secret
      PAPERLESS_REMOTE_USER_HEADER: ${PAPERLESS_MCP_REMOTE_USER_HEADER:-X-Papaia-Remote-User}
      PAPERLESS_USERNAME_CLAIM:     ${PAPERLESS_MCP_USERNAME_CLAIM:-preferred_username}
      PAPERLESS_HTTP_TIMEOUT:       ${PAPERLESS_MCP_HTTP_TIMEOUT:-30}
      PAPERLESS_MAX_DOWNLOAD_BYTES: ${PAPERLESS_MCP_MAX_DOWNLOAD_BYTES:-10485760}
      MCP_HOST:                     ${PAPERLESS_MCP_HOST:-0.0.0.0}
      MCP_PORT:                     ${PAPERLESS_MCP_PORT:-8000}
      MCP_PATH:                     ${PAPERLESS_MCP_PATH:-/mcp}
      LOG_LEVEL:                    ${PAPERLESS_MCP_LOG_LEVEL:-INFO}
      # CA cert for httpx/ssl — trusts the bundled Keycloak self-signed cert.
      # Cleared to "" via overrides/addons/ when auth_provider=external_oidc.
      SSL_CERT_FILE:                /certs/local-ca.crt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - paperless
      - paperless-gate
    volumes:
      - ${PAPAIA_CONFIG_DIR}/certs:/certs:ro
      - type: volume
        source: paperless-gate-mcp
        target: /run/papaia/secrets/paperless-gate
        read_only: true
    networks:
      - papaia-paperless-net
      - paperless-front
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: mcp-server

  # ═══════════════════════════════════════════════════════════════════════════
  #  BROKER — Valkey message queue (Celery task broker)
  #
  #  Valkey speaks the Redis wire protocol, so PAPERLESS_REDIS keeps its
  #  redis:// scheme.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-broker:
    image: ${PAPERLESS_REDIS_IMAGE:-docker.io/valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882}
    restart: unless-stopped
    volumes:
      - paperless-valkeydata:/data
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: broker

  # ═══════════════════════════════════════════════════════════════════════════
  #  DATABASE — PostgreSQL
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-db:
    image: ${PAPERLESS_DB_IMAGE:-docker.io/library/postgres:18.7@sha256:f5cbc081c25690710f3fc6f4c61a7565382bae01ca0d0f2028a53d7926b85a20}
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PAPERLESS_DB:-paperless}
      POSTGRES_USER:     ${PAPERLESS_DBUSER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS}
    volumes:
      - paperless-pgdata:/var/lib/postgresql
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: database

  # ═══════════════════════════════════════════════════════════════════════════
  #  GOTENBERG — Document conversion (Office, email → PDF)
  #
  #  JavaScript disabled; only file:// URLs allowed to prevent SSRF.
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-gotenberg:
    image: ${PAPERLESS_GOTENBERG_IMAGE:-docker.io/gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996}
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: document-converter

  # ═══════════════════════════════════════════════════════════════════════════
  #  TIKA — Text extraction (Office documents, emails, and other formats)
  # ═══════════════════════════════════════════════════════════════════════════
  paperless-tika:
    image: ${PAPERLESS_TIKA_IMAGE:-docker.io/apache/tika:3.3.3.1@sha256:3049611264bb18cf66e6629f59818cad75ea5d46f770c504ae46537949838c67}
    restart: unless-stopped
    networks:
      - papaia-paperless-net
    labels:
      de.fidonis.module: papaia-paperless
      de.fidonis.role: text-extractor

networks:
  papaia-paperless-net:
    driver: bridge
    # Scoped to the deployment so multiple papAIa stacks can share a host;
    # papaia-ctl resolves the same value when it generates the Seam-1 override.
    # A default single-stack host keeps the name papaia-paperless-net.
    name: ${PAPAIA_PROJECT:-papaia}-paperless-net
  # The MCP server's side towards LibreChat. papaia-ctl attaches librechat
  # here and generates the same declaration at `addon start`.
  paperless-front:
    driver: bridge
    name: ${PAPAIA_PROJECT:-papaia}-paperless-front

volumes:
  paperless-data:
  paperless-pgdata:
  paperless-valkeydata:
  # The MCP server's gate secret, written by paperless-gate.
  paperless-gate-mcp:
