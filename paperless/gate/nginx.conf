# ═══════════════════════════════════════════════════════════════════════════
# paperless-gate — nginx configuration template
# by Fidonis GmbH · https://fidonis.de
#
# Paperless takes the person from X-Papaia-Remote-User and listens only on the
# loopback of its container. This gate runs in the same network namespace and
# is the only way in: a request passes only when X-Papaia-Gate carries the
# secret of one of its callers (the proxy, the MCP server), and a person the
# MCP server names passes only when the realm sync lists that name. gate.sh
# writes the callers' map and the listed names in place of the marker lines
# below; the rendered file lives in memory only (tmpfs) and is never logged.
# ═══════════════════════════════════════════════════════════════════════════
worker_processes 1;
pid /tmp/gate/nginx.pid;
# nginx' error lines quote the request line, which can carry a search text;
# upstream failures show as status 502 in the access log instead.
error_log stderr crit;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    # A header such as X_Papaia_Remote_User must never reach Paperless, whose
    # WSGI server would read it as the identity header.
    underscores_in_headers off;
    ignore_invalid_headers on;

    # Room for the name list: up to 1 MiB of names of up to 255 characters.
    map_hash_max_size 131072;
    map_hash_bucket_size 512;

    client_body_temp_path /tmp/gate/client_body;
    proxy_temp_path /tmp/gate/proxy;
    fastcgi_temp_path /tmp/gate/fastcgi;
    uwsgi_temp_path /tmp/gate/uwsgi;
    scgi_temp_path /tmp/gate/scgi;

    # Secret -> caller. An unknown, missing or repeated header maps to "".
    map $http_x_papaia_gate $gate_caller {
        default "";
        # @callers@
    }

    # Only the MCP server sets the person, from a checked token. The proxy
    # never forwards an identity (the browser signs in to Paperless itself).
    map $gate_caller $gate_remote_user {
        default "";
        mcp $http_x_papaia_remote_user;
    }

    # A name the MCP server sends must be one Paperless can compare safely.
    map $gate_remote_user $gate_name_ok {
        "" 1;
        "~^[A-Za-z0-9._@+-]{1,150}$" 1;
        default 0;
    }

    # Name -> the same name as the realm sync lists it. Paperless creates an
    # account for any name it does not know, so only listed names may reach it.
    map $gate_remote_user $gate_listed {
        default "";
        # @users@
    }

    # map compares strings without regard to case, Paperless does not: "Anna"
    # finds the listed "anna" above, and only a byte-for-byte match passes here.
    # No name contains a colon. An empty name carries no identity.
    map "$gate_remote_user:$gate_listed" $gate_name_known {
        default 0;
        ":" 1;
        "~^([^:]+):\1$" 1;
    }

    # A well-formed name that is not listed: one audit row.
    map "$gate_name_ok$gate_name_known" $gate_unknown_row {
        default "";
        10 1;
    }

    map $gate_caller $gate_refuse {
        "" 1;
        default "";
    }

    map $http_upgrade $gate_connection {
        default upgrade;
        "" "";
    }

    # Caller and outcome only: no path, query, header value or body.
    log_format gate escape=json '{"time":"$time_iso8601","caller":"$gate_caller",'
                                '"method":"$request_method","status":$status,'
                                '"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout gate;

    # papaia.audit/1 row for a refused unknown name: never the name, path or
    # header values. The container sets no time zone, so local time is UTC.
    map $time_iso8601 $gate_audit_time {
        "~^(?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})" $t;
        default "1970-01-01T00:00:00";
    }
    map $msec $gate_audit_ms {
        "~\.(?<ms>[0-9]{3})$" $ms;
        default "000";
    }
    # X-Papaia-Correlation-Id as papaia.audit/1 accepts it; anything else,
    # also a value shaped like a prefixed key, is replaced by the request id.
    map $http_x_papaia_correlation_id $gate_correlation_id {
        default $request_id;
        "~(^|-)(sk-[A-Za-z0-9-]{20}|glpat-[A-Za-z0-9-]{20}|xox[abeprs]-[A-Za-z0-9-]{10}|AKIA[0-9A-Z]{16})" $request_id;
        "~^[A-Za-z0-9-]{1,64}$" $http_x_papaia_correlation_id;
    }
    log_format gate_audit escape=json '{"format":"papaia.audit/1",'
        '"time":"$gate_audit_time.${gate_audit_ms}Z","correlation_id":"$gate_correlation_id",'
        '"writer":"paperless/paperless-gate","role":"server","sub":null,"identity_kind":null,'
        '"operation":"gate.forward","effect":"check","result":"denied",'
        '"error_code":"paperless_unknown_user","event":"paperless_unknown_user","object_ref":null}';
    access_log /dev/stdout gate_audit if=$gate_unknown_row;

    server {
        listen 8001;
        server_name _;

        # Uploads, as on the proxy route.
        client_max_body_size 100m;
        proxy_request_buffering off;

        if ($gate_refuse) {
            return 403;
        }
        if ($gate_name_ok = 0) {
            return 400;
        }
        # Before Paperless, which would create an account for the name.
        default_type application/json;
        if ($gate_name_known = 0) {
            return 403 '{"error":"paperless_unknown_user"}\n';
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Papaia-Gate "";
            proxy_set_header X-Papaia-Remote-User $gate_remote_user;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gate_connection;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }
    }
}
