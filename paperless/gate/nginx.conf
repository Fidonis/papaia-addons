# ═══════════════════════════════════════════════════════════════════════════
# paperless-gate — nginx configuration template
# by Fidonis GmbH · https://fidonis.de
#
# Paperless takes the person from X-Papaia-Remote-User and listens only on the
# loopback of its container. This gate runs in the same network namespace and
# is the only way in: a request passes only when X-Papaia-Gate carries the
# secret of one of its callers (the proxy, the MCP server). gate.sh writes the
# callers' map in place of the marker line below; the rendered file lives in
# memory only (tmpfs) and is never logged.
# ═══════════════════════════════════════════════════════════════════════════
worker_processes 1;
pid /tmp/gate/nginx.pid;
# nginx' error lines quote the request line, which can carry a search text;
# upstream failures show as status 502 in the access log instead.
error_log stderr crit;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    # A header such as X_Papaia_Remote_User must never reach Paperless, whose
    # WSGI server would read it as the identity header.
    underscores_in_headers off;
    ignore_invalid_headers on;

    client_body_temp_path /tmp/gate/client_body;
    proxy_temp_path /tmp/gate/proxy;
    fastcgi_temp_path /tmp/gate/fastcgi;
    uwsgi_temp_path /tmp/gate/uwsgi;
    scgi_temp_path /tmp/gate/scgi;

    # Secret -> caller. An unknown, missing or repeated header maps to "".
    map $http_x_papaia_gate $gate_caller {
        default "";
        # @callers@
    }

    # Only the MCP server sets the person, from a checked token. The proxy
    # never forwards an identity (the browser signs in to Paperless itself).
    map $gate_caller $gate_remote_user {
        default "";
        mcp $http_x_papaia_remote_user;
    }

    # A name the MCP server sends must be one Paperless can compare safely.
    map $gate_remote_user $gate_name_ok {
        "" 1;
        "~^[A-Za-z0-9._@+-]{1,150}$" 1;
        default 0;
    }

    map $gate_caller $gate_refuse {
        "" 1;
        default "";
    }

    map $http_upgrade $gate_connection {
        default upgrade;
        "" "";
    }

    # Caller and outcome only: no path, query, header value or body.
    log_format gate escape=json '{"time":"$time_iso8601","caller":"$gate_caller",'
                                '"method":"$request_method","status":$status,'
                                '"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout gate;

    server {
        listen 8001;
        server_name _;

        # Uploads, as on the proxy route.
        client_max_body_size 100m;
        proxy_request_buffering off;

        if ($gate_refuse) {
            return 403;
        }
        if ($gate_name_ok = 0) {
            return 400;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Papaia-Gate "";
            proxy_set_header X-Papaia-Remote-User $gate_remote_user;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gate_connection;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }
    }
}
