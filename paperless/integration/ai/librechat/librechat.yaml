mcpServers:
  Paperless:
    title: 'Paperless'
    description: 'OIDC-secured document management via Paperless-ngx.'
    type: streamable-http
    url: http://paperless-mcp:8000/mcp
    headers:
      Authorization: "Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}"
    # Lazy init: paperless-mcp validates a real user Bearer token.
    # Without startup: false, LibreChat attempts to connect at process start
    # with the unsubstituted placeholder, sees a 401, then falls back to MCP
    # dynamic OAuth discovery (which paperless-mcp does not speak) and burns
    # 120 s in OAuth handling timeout per retry cycle.
    startup: false
