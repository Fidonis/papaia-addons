# Nginx Proxy Manager — Paperless-ngx proxy host configuration reference
#
# Use this as a guide when adding the Paperless proxy host via the NPM web UI
# (or NPM API). Replace PAPERLESS_PUBLIC_URL with the actual public FQDN.
#
# For raw nginx (without NPM), this can be used as a server block snippet.

server {
    listen 443 ssl;
    server_name docs.example.com;  # Replace with your PAPERLESS_PUBLIC_URL hostname

    # TLS — managed by NPM or your own certificate provider
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    location / {
        proxy_pass         http://paperless:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Paperless file uploads
        client_max_body_size 100m;

        # Strip any Trust-header injected externally (defense-in-depth)
        proxy_set_header   X-Papaia-Remote-User "";
    }
}
