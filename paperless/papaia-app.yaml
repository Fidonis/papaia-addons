name: paperless
version: 1.1.0
addon_repo: papaia-addon-paperless
requires:
  # Contract generation this addon is built against; checked against the
  # core's ADDON_API window by cores that support compatibility gating.
  addon_api: 1
# Fallback axis for cores that do not read `requires` yet.
papaia_compat: ">=0.8.0"
description: "Paperless-ngx document management + OIDC/RBAC MCP server"

networks:
  app_network: papaia-paperless-net
  attach: [nginx-proxy-manager, librechat]

# Env vars pointing at the bundled-Keycloak CA cert (mounted from
# $PAPAIA_CONFIG_DIR/certs). papaia-ctl clears them via a generated override
# when auth_provider=external_oidc, so requests/httpx fall back to the
# system CA bundle instead of failing on the absent local-ca.crt.
local_ca_env:
  paperless: [REQUESTS_CA_BUNDLE]
  paperless-mcp: [SSL_CERT_FILE]

# Per-variable metadata: label (human-readable prompt text), hint (secondary
# explanation), default (overrides .env.example value), default_from_core
# (pulls value from core .env by key name), type (text|integer|url|decimal),
# secret (bool — true forces masking, false opts out of name heuristic),
# min/max (numeric bounds for integer/decimal), pattern (regex for text).
# All fields are optional; add-ons without env_prompts entries continue to
# work unchanged (readers ignore unknown manifest keys).
env_prompts:

  # ── Core OIDC ─────────────────────────────────────────────────────────────
  PAPAIA_CONFIG_DIR:
    label: "papAIa config directory"
    hint: "Path to the directory created by papaia-ctl setup (PAPAIA_CONFIG_DIR)"
    default_from_core: PAPAIA_CONFIG_DIR
    type: text

  OIDC_ISSUER:
    label: "Keycloak issuer URL"
    hint: "Browser-facing URL, must match OIDC_ISSUER from core setup"
    default_from_core: OIDC_ISSUER
    type: url

  # ── Paperless-ngx — Public URL ────────────────────────────────────────────
  PAPERLESS_PUBLIC_URL:
    label: "Paperless public URL"
    hint: "Browser-facing URL of the Paperless web UI (scheme + host + optional port)"
    default: "http://host.docker.internal:8010"
    type: url

  # ── Paperless-ngx — Database ──────────────────────────────────────────────
  PAPERLESS_DB:
    label: "Database name"
    type: text

  PAPERLESS_DBUSER:
    label: "Database user"
    type: text

  PAPERLESS_DBPASS:
    label: "Database password"
    secret: true    # name heuristic misses DBPASS; auto-generated by seed_addon_env

  # ── Paperless-ngx — Security ──────────────────────────────────────────────
  PAPERLESS_SECRET_KEY:
    label: "Django secret key"
    hint: "Long random string used for cryptographic signing; auto-generated on install"
    secret: true

  # ── Paperless-ngx — Bootstrap admin ──────────────────────────────────────
  PAPERLESS_ADMIN_USER:
    label: "Bootstrap admin username"
    hint: "Break-glass account; SSO login via Keycloak is the default path"
    type: text

  PAPERLESS_ADMIN_PASSWORD:
    label: "Bootstrap admin password"
    hint: "Auto-generated; use only for emergency break-glass access"
    secret: true

  PAPERLESS_ADMIN_MAIL:
    label: "Bootstrap admin e-mail"
    type: text

  # ── Keycloak OIDC client secrets ──────────────────────────────────────────
  # These are filled after the Keycloak client import — see env_replace_secrets below.
  KC_PAPERLESS_CLIENT_SECRET:
    label: "Keycloak client secret (paperless)"
    hint: "Copy from Keycloak Admin UI → Clients → paperless → Credentials → Client Secret"
    secret: true

  KC_MCP_PAPERLESS_CLIENT_SECRET:
    label: "Keycloak client secret (mcp-paperless)"
    hint: "Copy from Keycloak Admin UI → Clients → mcp-paperless → Credentials → Client Secret"
    secret: true

  # ── Paperless-ngx — OCR ───────────────────────────────────────────────────
  PAPERLESS_OCR_LANGUAGE:
    label: "Tesseract OCR primary language"
    hint: "ISO 639-2/T code (e.g. deu, eng). Container ships with deu + eng."
    type: text

  # ── Paperless-ngx — HTTP protocol ────────────────────────────────────────
  PAPERLESS_HTTP_PROTOCOL:
    label: "HTTP protocol"
    hint: "Set to https when PAPERLESS_PUBLIC_URL uses HTTPS, http otherwise"
    type: text

  # ── Paperless-ngx — SSO / Login behaviour ─────────────────────────────────
  PAPERLESS_DISABLE_REGULAR_LOGIN:
    label: "Disable password login"
    hint: "true = SSO-only (Keycloak); emergency access via docker exec … createsuperuser"
    type: text

  PAPERLESS_REDIRECT_LOGIN_TO_SSO:
    label: "Redirect login page to Keycloak"
    hint: "true = bypass the Paperless login form and go straight to Keycloak"
    type: text

  PAPERLESS_SOCIAL_AUTO_SIGNUP:
    label: "Auto-create account on first SSO login"
    type: text

  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS:
    label: "Sync Keycloak realm roles to Paperless groups on login"
    hint: "Groups must already exist in Paperless; the sync does not create them"
    type: text

  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM:
    label: "Keycloak claim that carries the group names"
    type: text

  # ── Paperless-ngx — Document processing ───────────────────────────────────
  PAPERLESS_TIKA_ENABLED:
    label: "Enable Tika/Gotenberg (Office document support)"
    hint: "1 = enabled (default), 0 = disabled. Office files (.docx, .xlsx) require Tika."
    type: integer
    min: 0
    max: 1

  # ── Paperless-ngx — External port ─────────────────────────────────────────
  PAPERLESS_EXT_PORT:
    label: "Paperless host port"
    hint: "Must match the port in PAPERLESS_PUBLIC_URL"
    type: integer
    min: 1
    max: 65535

  # ── MCP server ────────────────────────────────────────────────────────────
  PAPERLESS_MCP_OIDC_AUDIENCE:
    label: "MCP server token audience"
    hint: "Must match the mcp-paperless-audience mapper on the LibreChat Keycloak client"
    type: text

  PAPERLESS_MCP_OIDC_JWKS_CACHE_TTL:
    label: "JWKS cache TTL (seconds)"
    type: integer
    min: 0

  PAPERLESS_MCP_PAPERLESS_URL:
    label: "Paperless internal URL (same Docker network)"
    type: url

  PAPERLESS_MCP_REMOTE_USER_HEADER:
    label: "Remote-user header name"
    type: text

  PAPERLESS_MCP_USERNAME_CLAIM:
    label: "Username JWT claim"
    type: text

  PAPERLESS_MCP_HTTP_TIMEOUT:
    label: "MCP HTTP timeout (seconds)"
    type: integer
    min: 1

  PAPERLESS_MCP_MAX_DOWNLOAD_BYTES:
    label: "MCP maximum download size (bytes)"
    type: integer
    min: 1

  PAPERLESS_MCP_PORT:
    label: "MCP server port"
    type: integer
    min: 1
    max: 65535

  PAPERLESS_MCP_PATH:
    label: "MCP endpoint path"
    type: text

  PAPERLESS_MCP_LOG_LEVEL:
    label: "MCP log level"
    hint: "One of: DEBUG, INFO, WARNING, ERROR"
    type: text

env_replace_secrets:
  KC_PAPERLESS_CLIENT_SECRET:
    hint: "Keycloak Admin UI → Clients → paperless → Credentials → Client Secret"
  KC_MCP_PAPERLESS_CLIENT_SECRET:
    hint: "Keycloak Admin UI → Clients → mcp-paperless → Credentials → Client Secret"

integration:
  keycloak:
    clients:
      - integration/infra/keycloak/paperless.json
      - integration/infra/keycloak/mcp-paperless.json
    client_mappers:
      librechat:
        - integration/infra/keycloak/librechat-audience-mapper.json
  librechat: integration/ai/librechat/librechat.yaml
  nginx: integration/infra/nginx/paperless.conf
