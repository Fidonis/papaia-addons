# Nginx Proxy Manager — qdrant-ingest web interface proxy host reference
#
# Use this as a guide when adding the proxy host via the NPM web UI (or NPM
# API). Replace the server_name with the actual QI_UI_PUBLIC_URL hostname.
#
# For raw nginx (without NPM), this can be used as a server block snippet.
#
# Only the web interface is published here. /v1 (static bearer token) and
# /mcp (OIDC resource server) are deliberately absent from this fragment —
# the REST and MCP control planes are not meant to be reachable from the
# internet; see the README's Security notes.

server {
    listen 443 ssl;
    server_name ingest.example.com;  # Replace with your QI_UI_PUBLIC_URL hostname

    # TLS — managed by NPM or your own certificate provider
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    location /ui/ {
        proxy_pass         http://qdrant-ingest:8300;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else 404s rather than falling through to the ingester's
    # other surfaces.
    location / {
        return 404;
    }
}
