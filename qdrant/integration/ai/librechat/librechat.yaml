mcpServers:
  Qdrant:
    title: 'Qdrant'
    description: 'OIDC-secured vector search over your Qdrant collections.'
    type: streamable-http
    url: http://qdrant-mcp:8000/mcp
    headers:
      Authorization: "Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}"
    # Lazy init: qdrant-mcp validates a real user Bearer token.
    # Without startup: false, LibreChat attempts to connect at process start
    # with the unsubstituted placeholder, sees a 401, then falls back to MCP
    # dynamic OAuth discovery (which qdrant-mcp does not speak) and burns
    # 120 s in OAuth handling timeout per retry cycle.
    startup: false

mcpSettings:
  allowedDomains:
    - "http://qdrant-mcp:8000"
