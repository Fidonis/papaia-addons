name: qdrant
version: 2.0.0
addon_repo: papaia-addon-qdrant
requires:
  # Contract generation this addon is built against; checked against the
  # core's ADDON_API window by cores that support compatibility gating.
  # 2: networks.app_network carries a ${PAPAIA_PROJECT:-papaia} template
  # that the core resolves against its .env (needs a core serving addon_api 2).
  addon_api: 2
# Fallback axis for cores that do not read `requires` yet. 1.3.0 is the first
# core serving addon_api 2 (deployment-scoped add-on networks).
papaia_compat: ">=1.3.0"
description: "Qdrant vector database + OIDC/RBAC MCP server"

# The software this add-on packages. `version` above counts the add-on itself;
# the `version` of each entry below is the default tag of its `image_var` in
# docker-compose.yml, and tools/components.py keeps the two equal.
components:
  - id: qdrant
    name: Qdrant
    role: primary
    kind: upstream
    image_var: QDRANT_IMAGE
    version: "v1.19.0"
    source: https://github.com/qdrant/qdrant
  - id: qdrant-mcp-rbac
    name: qdrant-mcp-rbac
    role: primary
    kind: fidonis
    image_var: QDRANT_MCP_IMAGE
    version: "0.3.0"
    source: https://github.com/Fidonis/qdrant-mcp-rbac

networks:
  # Resolved by papaia-ctl against the core .env, matching the add-on's own
  # compose network name. Scopes the Seam-1 bridge per deployment; a default
  # single-stack host resolves it to papaia-qdrant-net.
  app_network: "${PAPAIA_PROJECT:-papaia}-qdrant-net"
  # litellm is attached because the MCP server embeds natural-language queries
  # through it (search_collection_by_text); librechat is the MCP client.
  attach: [librechat, litellm]

# Env vars pointing at the bundled-Keycloak CA cert (mounted from
# $PAPAIA_CONFIG_DIR/certs). papaia-ctl clears them via a generated override
# when auth_provider=external_oidc, so requests/httpx fall back to the
# system CA bundle instead of failing on the absent local-ca.crt.
local_ca_env:
  qdrant-mcp: [SSL_CERT_FILE]

# Per-variable metadata: label (human-readable prompt text), hint (secondary
# explanation), default (overrides .env.example value), default_from_core
# (pulls value from core .env by key name), type (text|integer|url|decimal),
# secret (bool — true forces masking, false opts out of name heuristic),
# min/max (numeric bounds for integer/decimal), pattern (regex for text).
# All fields are optional; add-ons without env_prompts entries continue to
# work unchanged (readers ignore unknown manifest keys).
env_prompts:

  # ── Core OIDC ─────────────────────────────────────────────────────────────
  PAPAIA_CONFIG_DIR:
    label: "papAIa config directory"
    hint: "Path to the directory created by papaia-ctl setup (PAPAIA_CONFIG_DIR)"
    default_from_core: PAPAIA_CONFIG_DIR
    type: text

  OIDC_ISSUER:
    label: "Keycloak issuer URL"
    hint: "Browser-facing URL, must match OIDC_ISSUER from core setup"
    default_from_core: OIDC_ISSUER
    type: url

  # ── Qdrant — Vector database ──────────────────────────────────────────────
  QDRANT_JWT_SECRET:
    label: "Qdrant api-key / JWT signing secret"
    hint: "Master credential of the vector database; auto-generated on install"
    secret: true    # name heuristic misses JWT_SECRET; auto-generated by seed_addon_env

  QDRANT_EXT_PORT:
    label: "Qdrant host port"
    hint: "Published REST port for bootstrap and ingestion; the dashboard lives at /dashboard"
    type: integer
    min: 1
    max: 65535

  # ── MCP server — OIDC ─────────────────────────────────────────────────────
  QDRANT_MCP_OIDC_AUDIENCE:
    label: "MCP server token audience"
    hint: "Must match the mcp-qdrant-audience mapper on the LibreChat Keycloak client"
    type: text

  QDRANT_MCP_OIDC_JWKS_CACHE_TTL:
    label: "JWKS cache TTL (seconds)"
    type: integer
    min: 0

  # ── MCP server — Qdrant connection ────────────────────────────────────────
  QDRANT_MCP_QDRANT_URL:
    label: "Qdrant internal URL (same Docker network)"
    type: url

  QDRANT_MCP_QDRANT_JWT_TTL:
    label: "Derived Qdrant JWT TTL (seconds)"
    type: integer
    min: 60

  # ── MCP server — Embeddings ───────────────────────────────────────────────
  QDRANT_MCP_EMBEDDING_API_URL:
    label: "Embeddings endpoint"
    hint: "OpenAI-compatible base URL including the API prefix; LiteLLM inside papAIa is http://litellm:4000/v1"
    type: url

  QDRANT_MCP_EMBEDDING_API_KEY:
    label: "Embeddings API key"
    hint: "LITELLM_MASTER_KEY from <papaia-config>/ai/litellm/.env when using LiteLLM"
    secret: true

  QDRANT_MCP_EMBEDDING_META_COLLECTION:
    label: "Embedding metadata collection"
    hint: "Qdrant collection holding the per-collection embedding model; auto-created"
    type: text

  # ── MCP server — RBAC ─────────────────────────────────────────────────────
  QDRANT_MCP_RBAC_ADMIN_ROLE:
    label: "Break-glass admin role"
    hint: "Keycloak realm role whose members receive a global Qdrant manage token"
    type: text

  QDRANT_MCP_RBAC_ACL_COLLECTION:
    label: "ACL collection"
    hint: "Qdrant collection holding the role grants; auto-created on first access"
    type: text

  QDRANT_MCP_RBAC_ACL_CACHE_TTL:
    label: "ACL cache TTL (seconds)"
    type: integer
    min: 1

  QDRANT_MCP_RBAC_SERVICE_TOKEN_TTL:
    label: "ACL service token TTL (seconds)"
    type: integer
    min: 10

  # ── MCP server — Listener ─────────────────────────────────────────────────
  QDRANT_MCP_PORT:
    label: "MCP server port"
    type: integer
    min: 1
    max: 65535

  QDRANT_MCP_PATH:
    label: "MCP endpoint path"
    type: text

  QDRANT_MCP_LOG_LEVEL:
    label: "MCP log level"
    hint: "One of: DEBUG, INFO, WARNING, ERROR"
    type: text

integration:
  keycloak:
    clients:
      - integration/infra/keycloak/mcp-qdrant.json
    client_mappers:
      librechat:
        - integration/infra/keycloak/librechat-audience-mapper.json
  librechat: integration/ai/librechat/librechat.yaml
