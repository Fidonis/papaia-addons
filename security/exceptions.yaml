# Accepted CRITICAL and HIGH findings with a fix in the images the add-ons pin.
#
# Covers each image default of a delivered add-on (`tools/image_refs.py list`,
# third-party and own images alike, release candidates from a test registry
# included) and the CI tool set (`tools/ci`). Read by tools/scan_gate.py,
# which every image scan runs (pull requests, publish and the nightly scan).
#
# The rule (docs/development.md, "Vulnerability scan"):
#
# - A CRITICAL or HIGH finding with a fix fails the scan unless an approved
#   entry here covers it.
# - A CRITICAL or HIGH finding without a fix never fails the scan and gets no
#   entry. Each run lists it in `no-fix.txt` beside the JSON report (artifact
#   of the scan job, kept 90 days) and counts it in the step summary; a
#   maintainer reviews these lists once a month and records the review in the
#   "Monthly review" table of docs/development.md. An entry that matches only
#   such a finding waives nothing and is reported for removal.
# - Own images (ghcr.io/fidonis/...): a finding with a fix is fixed in the
#   image. An entry is the exception for a fix that cannot be taken in the
#   image (it lives only in vendored upstream code); it runs at most 90 days.
#   The same form holds for the CI tool set.
# - Third-party images: an entry is allowed only while the distribution ships
#   the fixed package and the upstream image is not rebuilt yet. It names the
#   pinned digest and runs at most 14 days. The reason names the tag checked
#   and the digest it pointed to on that date. Re-pinning does not extend
#   `expires`; when the pin moves, the gate refuses the entry until it is
#   re-checked against the scan of the new pin and rewritten or removed.
#
# No entry waives anything before the security officer countersigns it:
# `approved_by: pending ...` is listed and the finding still fails. No release
# is cut while any entry is pending: `tools/release_line.py` refuses on main,
# on pull requests into main and when a release is published.
# tools/test_scan_gate.py fails when an entry names an image or digest that
# no add-on default pins any more.
#
# Own image or CI tool set (one entry per finding):
#
#   - id: CVE-2026-00000             # as Trivy reports it (CVE-, GHSA-, ...)
#     package: libexample            # PkgName in the report
#     image: ghcr.io/fidonis/name    # repository without tag or digest; for a
#                                    # test registry candidate the published
#                                    # repository (ghcr.io/fidonis/<name>)
#     severity: HIGH                 # HIGH or CRITICAL, as reported
#     reason: >-                     # why it is accepted and what resolves it
#       ...
#     added: 2026-11-24              # unquoted dates
#     expires: 2027-02-22            # at most 90 days after `added`
#     approved_by: <role that countersigned>
#                                    # or `pending (<role that countersigns>)`
#
# Third-party image (one entry per finding with a fix):
#
#   - id: CVE-2026-00000
#     package: libexample
#     image: docker.io/library/name  # repository as pinned, without tag or digest
#     digest: sha256:<64 hex>        # the pinned image index; covers this digest only
#     severity: HIGH
#     reason: >-                     # distribution fix available, upstream image not
#       ...                          # rebuilt yet: tag and digest checked, with date
#     added: 2026-11-25
#     expires: 2026-12-09            # at most 14 days after `added`
#     approved_by: pending (<role that countersigns>)
#
# Unknown fields are refused. An expired entry fails every scan until it is
# removed or renewed with a new review; an approved entry whose finding is
# gone is reported as unused and should be removed.
#
# Review schedule: the third-party entries added on 2026-11-25 expire on
# 2026-12-09; the own image entries on 2027-02-22. One expired entry fails
# every image scan and the nightly scan.

