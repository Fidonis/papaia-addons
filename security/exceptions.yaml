# Accepted vulnerability findings of every image the add-ons pin.
#
# Covers each image default of a delivered add-on (`tools/image_refs.py list`,
# third-party and own images alike, release candidates from a test registry
# included) and the CI tool set (`tools/ci`). Read by tools/scan_gate.py,
# which every image scan runs (pull requests, publish and the nightly scan).
# Without an approved entry here, a CRITICAL or HIGH finding with a fixed
# version available fails the scan.
#
# A CRITICAL or HIGH finding without a fix does not fail the scan, but it gets
# an entry too, so each remaining finding is reviewed and justified on its
# own; the entry counts as used while the finding is present. A finding with
# a fix that cannot be taken in the image (the fix lives only in vendored
# upstream code) also gets an entry. No entry waives anything before the
# security officer countersigns it: `approved_by: pending ...` is listed and
# the finding still fails. tools/test_scan_gate.py fails when an entry names
# an image that no add-on default pins any more.
#
# One entry per finding:
#
#   - id: CVE-2026-00000             # as Trivy reports it (CVE-, GHSA-, ...)
#     package: libexample            # PkgName in the report
#     image: docker.io/library/name  # repository as pinned, without tag or digest;
#                                    # for a test registry candidate the published
#                                    # repository (ghcr.io/fidonis/<name>)
#     severity: HIGH                 # HIGH or CRITICAL, as reported
#     reason: >-                     # why it is accepted and what resolves it
#       ...
#     added: 2026-11-24              # unquoted dates
#     expires: 2027-02-22            # at most 90 days after `added`
#     approved_by: <role that countersigned>
#                                    # or `pending (<role that countersigns>)`
#
# Unknown fields are refused. An expired entry fails every scan until it is
# removed or renewed with a new review; an approved entry whose finding is
# gone is reported as unused and should be removed.
#
# Review schedule: the entries added on 2026-11-24 all expire on 2027-02-22,
# and one expired entry fails every image scan and the nightly scan. Re-review
# them before 2027-02-08. When countersigning, the security officer may set
# shorter expiries per image to stagger the next reviews.

